[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aula-f108"
version = "0.1.0"
description = "Configure the Aula F108 Pro keyboard on Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
aula-f108 = "aula_f108.cli:main"

[tool.setuptools]
packages = ["aula_f108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
